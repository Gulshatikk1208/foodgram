[flake8]
ignore =
    W503,
    F811,
    I001,
    I005
exclude =
    tests/,
    */migrations/,
    data/
    venv/,
    env/,
    docs/,
    frontend/,
    infra/
per-file-ignores =
    */settings.py:E501
    */manage.py:E501

[isort]
profile = black
known_first_party = recipes,users,foodgram_backend,api
known_django = django
sections = STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
